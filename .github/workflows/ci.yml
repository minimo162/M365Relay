name: CI and Windows distribution
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - run: node scripts/check.mjs
      - run: node --test
      - name: Python document storage contracts
        if: runner.os == 'Linux'
        run: python3 -I -B test/python-document-test.py
      - name: Parse Windows PowerShell scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem scripts/*.ps1,launcher/*.ps1,python/*.ps1,test/office-existing-process.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Actual browser with synthetic composer (no M365)
        run: |
          browser_path="$(command -v google-chrome)"
          test -n "$browser_path"
          CHROMIUM_PATH="$browser_path" npm run test:browser
  windows-distribution:
    needs: [contracts, browser-regression]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Package pinned Node.js with application
        shell: powershell
        run: ./scripts/Package-Release.ps1
      - name: Test real bundled runtime without PATH Node
        shell: powershell
        run: |
          $zip = @(Get-ChildItem dist/*.zip)
          if ($zip.Count -ne 1) { throw 'Expected exactly one distribution ZIP.' }
          ./scripts/Test-Distribution.ps1 -ZipPath $zip[0].FullName
      - name: Test launcher installation, update and recovery
        shell: powershell
        run: |
          $zip = @(Get-ChildItem dist/*.zip)
          ./scripts/Test-Updater.ps1 -FirstZip $zip[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Updater checks failed.' }
          ./scripts/New-UpdateChannel.ps1 -ZipPath $zip[0].FullName -OutputDirectory dist/update-channel -Source https://github.com/minimo162/M365Relay/releases/latest/download/update.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: M365Relay-auto-update-channel
          path: dist/update-channel/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: M365Relay-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
